name: Build Windows EXE
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1

      # 强制使用 x86 (32位) 平台编译，并忽略警告
      - name: Build Solution
        run: msbuild ASRClientCore/ASRClientCore.sln /t:Restore,Build /p:Configuration=Release /p:Platform="x86" /p:TreatWarningsAsErrors=false

      # 同样使用 x86 进行发布
      - name: Publish EXE
        run: msbuild ASRClientCore/ASRClientCore.csproj /t:Publish /p:Configuration=Release /p:Platform="x86" /p:PublishSingleFile=true /p:PublishDir="../publish/" /p:TreatWarningsAsErrors=false

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASRClientCore-Win32
          path: ./publish/
