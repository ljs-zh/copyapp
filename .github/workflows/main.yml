name: Build Official EXE
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout ASRClientCore
        uses: actions/checkout@v4
        with:
          repository: YC-nw/ASRClientCore
          path: ASRClientCore

      - name: Checkout AdbApiWrapper
        uses: actions/checkout@v4
        with:
          repository: YC-nw/AdbApiWrapper
          path: AdbApiWrapper

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1

      - name: Restore Dependencies
        run: dotnet restore ASRClientCore/ASRClientCore.csproj

      - name: Build Solution
        run: msbuild ASRClientCore/ASRClientCore.sln /t:Build /p:Configuration=Release /p:Platform="x64"

      - name: Publish EXE
        run: dotnet publish ASRClientCore/ASRClientCore.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASRClientCore-Win64
          path: ./publish/
