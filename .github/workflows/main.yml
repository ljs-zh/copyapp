name: Build Official EXE
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      # 直接去克隆原作者的纯净代码，不要用你本地上传的那个！
      - name: Checkout Official Repo
        uses: actions/checkout@v4
        with:
          repository: YC-nw/ASRClientCore
          ref: master

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 纯 C# 项目，直接用 dotnet 发布
      - name: Publish EXE
        run: dotnet publish ASRClientCore.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o ./publish

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASRClientCore-Official
          path: ./publish/
