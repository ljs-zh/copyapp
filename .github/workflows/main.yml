name: Build Windows EXE
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 第一步：先编译整个解决方案（包含 C++ 和 C#）
      - name: Build Solution
        run: msbuild ASRClientCore/ASRClientCore.sln /t:Restore,Build /p:Configuration=Release /p:Platform="x64"

      # 第二步：单独把 C# 项目发布成独立的 exe，并放到 publish 文件夹
      - name: Publish EXE
        run: msbuild ASRClientCore/ASRClientCore.csproj /t:Publish /p:Configuration=Release /p:Platform="x64" /p:PublishSingleFile=true /p:PublishDir="../publish/"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASRClientCore-Win64
          path: ./publish/
