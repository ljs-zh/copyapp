name: Build Windows EXE
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish EXE
        run: dotnet publish ASRClientCore/ASRClientCore.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -o ./publish
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASRClientCore-Win64
          path: ./publish/ASRClientCore.exe
